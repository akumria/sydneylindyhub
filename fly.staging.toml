app = "sydneylindyhub-staging-editor"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"
  build-target = "web"

[deploy]
  # Runtime credentials edit data; schema migrations are an explicit owner operation.
  release_command = "bin/rails db:abort_if_pending_migrations"
  release_command_timeout = "5m"

[env]
  # Public links still point at the public site; this app cannot publish it.
  CANONICAL_HOST = "www.sydneylindyhub.com"
  EDITORIAL_HOST = "sydneylindyhub-staging-editor.fly.dev"
  PORT = "8080"
  RAILS_ASSUME_SSL = "true"
  RAILS_MAX_THREADS = "3"
  STATIC_PUBLISH_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 3
    hard_limit = 6

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/up"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
