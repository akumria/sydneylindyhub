development:
  adapter:  postgresql
  host:     <%= ENV.fetch("PGHOST", "localhost") %>
  username: <%= ENV["PGUSER"] %>
  password: <%= ENV["PGPASSWORD"] %>
  encoding: unicode
  database: soldn1_dev
  pool:     5

  # Connect on a TCP socket. Omitted by default since the client uses a
  # domain socket that doesn't need configuration. Windows does not have
  # domain sockets, so uncomment these lines.
  #host: localhost
  #port: 5432

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # The server defaults to notice.
  #min_messages: warning

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  adapter:  postgresql
  host:     <%= ENV.fetch("PGHOST", "localhost") %>
  username: <%= ENV["PGUSER"] %>
  password: <%= ENV["PGPASSWORD"] %>
  encoding: unicode
  database: soldn1_test
  pool:     5

production:
  adapter:  postgresql
  encoding: unicode
  # Managed hosts hand out a connection string. Read it with [] rather than
  # fetch: Rails evaluates the ERB in every section at boot, so fetch would
  # raise in development and test too. Rails reports a missing production URL
  # clearly enough on its own.
  url:      <%= ENV["DATABASE_URL"] %>
  # Stay ahead of Puma's thread count, which RAILS_MAX_THREADS sets. See the
  # note in config/puma.rb.
  pool:     <%= ENV.fetch("RAILS_MAX_THREADS", 3) + 2 %>
