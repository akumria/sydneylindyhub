name: Organiser reminders
run-name: Organiser reminders (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview only, or submit reminders to Fastmail
        type: choice
        options: [dry-run, send]
        default: dry-run
        required: true
      event_ids:
        description: Comma-separated event IDs from a reviewed dry-run (required for send)
        type: string
        required: false
      confirmation:
        description: Type SEND to submit messages (leave blank for dry-run)
        type: string
        required: false
      sent_copy_confirmed:
        description: I verified Fastmail saves SMTP messages from hello@sydneylindyhub.com in Sent
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-organiser-reminders
  cancel-in-progress: false

jobs:
  reminders:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Give this environment required reviewers before configuring send credentials.
    environment: ${{ inputs.mode == 'send' && 'production-reminders' || 'production' }}
    env:
      MODE: ${{ inputs.mode }}
      EVENT_IDS: ${{ inputs.event_ids }}
      CONFIRM: ${{ inputs.confirmation }}
      SENT_COPY_CONFIRMED: ${{ inputs.sent_copy_confirmed }}
      CANONICAL_HOST: www.sydneylindyhub.com
      EDITORIAL_HOST: edit.sydneylindyhub.com
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check mode and explicit send approval
        run: |
          case "$MODE" in
            dry-run) ;;
            send)
              if [ "$CONFIRM" != SEND ] || [ "$SENT_COPY_CONFIRMED" != true ] || [ -z "$EVENT_IDS" ]; then
                echo '::error::Send requires event IDs, SEND confirmation and verified Fastmail Sent copies.'
                exit 1
              fi ;;
            *) echo '::error::Invalid mode.'; exit 1 ;;
          esac
          if [ -n "$EVENT_IDS" ] && ! [[ "$EVENT_IDS" =~ ^[0-9]+(,[[:space:]]*[0-9]+)*$ ]]; then
            echo '::error::Use comma-separated numeric event IDs.'
            exit 1
          fi

      - name: Build reminder runtime
        run: docker build --target web --tag slh-reminders:ci .

      - name: Preview or submit reminders
        env:
          PUBLICATION_DATABASE_URL: ${{ secrets.PUBLICATION_DATABASE_URL }}
          REMINDER_DATABASE_URL: ${{ secrets.REMINDER_DATABASE_URL }}
          SMTP_USER_NAME: ${{ inputs.mode == 'send' && secrets.SMTP_USER_NAME || '' }}
          SMTP_PASSWORD: ${{ inputs.mode == 'send' && secrets.SMTP_PASSWORD || '' }}
        run: |
          if [ "$MODE" = send ]; then
            export DATABASE_URL="$REMINDER_DATABASE_URL"
          else
            export DATABASE_URL="$PUBLICATION_DATABASE_URL"
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo '::error::Missing database connection for selected mode.'
            exit 1
          fi
          if [ "$MODE" = send ] && { [ -z "$SMTP_USER_NAME" ] || [ -z "$SMTP_PASSWORD" ]; }; then
            echo '::error::Missing SMTP credentials in production-reminders.'
            exit 1
          fi
          docker run --rm \
            -e MODE -e EVENT_IDS -e CONFIRM -e SENT_COPY_CONFIRMED \
            -e DATABASE_URL -e CANONICAL_HOST -e EDITORIAL_HOST \
            -e SMTP_USER_NAME -e SMTP_PASSWORD \
            slh-reminders:ci bash -euc '
              export SECRET_KEY_BASE="$(ruby -rsecurerandom -e "print SecureRandom.hex(64)")"
              bin/rails db:abort_if_pending_migrations
              exec bin/rails send_not_listed_reminders
            '
          echo "Reminder $MODE completed. Counts and masked previews are in the step log." >> "$GITHUB_STEP_SUMMARY"
