# This workflow uses actions that are not certified by GitHub.  They are
# provided by a third-party and are governed by separate terms of service,
# privacy policy, and support documentation.
#
# This workflow will install a prebuilt Ruby version, install dependencies, and
# run tests and linters.
name: "Ruby on Rails CI"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: rails-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and linters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Keep in step with .devcontainer/compose.yaml. PostgreSQL 14 reaches
        # end of life on 2026-11-12.
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        options: >-
          --health-cmd "pg_isready -U rails -d rails_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          bundler-cache: true
      - name: enable corepack
        run: corepack enable
      - name: install yarn
        run: corepack install
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
      - name: Install Javascript dependencies
        run: yarn install --immutable
      - name: Compile CSS
        run: bin/rails dartsass:build
      - name: Set up database schema
        run: bin/rails db:schema:load
      - name: Run tests and linters
        run: bin/rake
