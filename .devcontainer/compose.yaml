services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ..:/workspace/sydneylindyhub:cached
      - bundle:/usr/local/bundle

  postgres:
    # PostgreSQL 14 reaches end of life on 2026-11-12. 17 is supported until
    # November 2029 and is what every managed host we are likely to use offers.
    image: postgres:17-alpine
    mem_limit: 512m
    environment:
      POSTGRES_DB: soldn1_dev
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soldn1_dev"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  bundle:
  postgres-data:
